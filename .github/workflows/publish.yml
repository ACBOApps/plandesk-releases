# Δημοσίευση έκδοσης: όταν ανέβει branch "upload/vX.Y.Z" με τα κομμάτια του setup
# και το υπογεγραμμένο plandesk-update.json, ενώνει το setup, ελέγχει το SHA-256,
# δημιουργεί το Release και σβήνει το branch.
name: publish
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ένωση και έλεγχος
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#upload/v}"
          cat release/PlanDesk-Setup-$V.exe.part* > PlanDesk-Setup-$V.exe
          WANT=$(cat release/sha256.txt)
          GOT=$(sha256sum PlanDesk-Setup-$V.exe | cut -d' ' -f1)
          [ "$WANT" = "$GOT" ] || { echo "SHA-256 mismatch"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$V" "PlanDesk-Setup-$V.exe" release/plandesk-update.json \
            --repo "$GITHUB_REPOSITORY" --target main --title "PlanDesk $V" --notes-file release/notes.txt --latest
          git push origin --delete "$GITHUB_REF_NAME"
